AddonId: 7f3a91c4-6e28-4d15-b0aa-4c19d7e53b82
Packages:
  - Version: 1.0.2
    RequiredApiVersion: 6.16.0
    ReleaseDate: 2026-10-09
    PackageUrl: https://github.com/AbyssVII/playnite-gamevault/releases/download/v1.0.2/GameVault_1.0.2.pext
    Changelog:
      - 趣味功能页新增「锐评」：给游戏打 0–10 星级评分，并用富文本编辑器写长评（支持 H1/H2 标题、加粗、首行缩进、插图），全部本地保存；已评游戏在底部排成卡片墙，点击即可回改 / New "Reviews" page under Fun & Games: rate games with a 0–10 star scale and write long-form reviews in a rich-text editor (H1/H2 headings, bold, first-line indent, inline images), all stored locally; reviewed games line up as cards at the bottom for quick edits
      - 数据分析页新增「游玩周报」：以卡片流回顾过去 52 个活跃周，每周显示总时长与代表游戏封面，一年的爆肝与吃灰一目了然 / New weekly report on the Analytics page: a card stream recapping the last 52 active weeks with each week's total playtime and representative game cover
      - 概览卡「库存价值」改为「平均 Metacritic」：显示全库平均媒体评分与有评分款数 / The overview card "Library value" is now "Average Metacritic", showing the library's average critic score and how many games are rated
      - 侧边栏项目的位置**提前一位**：原来排在「Playnite 成就／最近活动」之后（侧边栏第 5 位），现在排到它们之前（第 3 位），紧挨着「库／统计」下方。Playnite 不允许插件指定侧边栏顺序（顺序由内核按「类型降序 → 标题」写死，库与统计固定在最前），插件唯一能影响的只有标题字符串，因此把侧边栏标题统一为「GameVault 游戏库存」——以 G 开头，在中文（zh-CN）比较规则下稳定排在「Playnite 成就」之前 / GameVault now sits **one slot higher** in the sidebar: previously after "Playnite Achievements" and "Recent Activity" (5th), now ahead of both (3rd), right below Library and Statistics. Playnite gives plugins no way to specify sidebar order (the host sorts by type, then title, with Library and Statistics pinned to the top), so the only lever is the title string; the sidebar title is now "GameVault 游戏库存", which starts with G and therefore sorts ahead of "Playnite Achievements" under the zh-CN comparison rules
      - 库存页**已安装的游戏四周加上一圈蓝紫色描边**（偏紫的 #7C5CFF），作为"这款在你机器上"的常驻标记；配合"未安装整体压暗"，已安装与未安装双向都好认。鼠标悬停时描边**提亮成更浅的紫**（#A78BFA）并加粗到 2px，不会和悬停高亮打架；网格与条形两种视图规则一致 / Installed games now carry a **blue-violet outline** (violet-leaning #7C5CFF) as a permanent "it's on your machine" marker; together with the dimming of uninstalled games, both states are easy to tell apart. On hover the outline **brightens to a lighter violet** (#A78BFA) and thickens to 2px so it never fights the hover highlight; the same rules apply in both grid and bar views
      - 修复在「总时长／近两周／MC 评分」之间切换排序时，会闪出一屏"挤在一起、还没显示完"的海报与名字：原因是网格用的是不分批虚拟化的换行面板，而换排序时是在**当前正绑定着的集合**上先清空、再一条条塞进去，于是列表被触发了上百次重排、中间大量残缺状态被逐帧画了出来；现在改成先把新一页数据装进一个全新集合、再一次性交给列表，整个切换只发生一次排版、直接到位 / Fixed a flash of densely packed, half-rendered posters and titles when switching between the Total / Last 2 weeks / MC score sorts: the grid uses a non-virtualising wrap panel, and switching sorts used to clear the *currently bound* collection and then add items one by one, firing hundreds of layout passes whose incomplete states were painted frame by frame; the new page is now built into a fresh collection first and handed to the list in one shot, so a switch costs a single layout pass and lands directly
      - 库存页**未安装的游戏整体压暗**（已安装保持正常亮度），一眼就能看出哪些是"囤了没下"；不给已安装的加额外装饰，只做减法 / Uninstalled games are now **dimmed** across the library while installed ones keep their normal brightness, so un-downloaded purchases stand out at a glance; nothing extra is added to the installed ones — it is purely subtractive
      - 鼠标移到游戏海报上时**海报会轻微放大**（1.06 倍、带缓动），同时浮出详情面板；网格与条形两种视图的手感一致 / Hovering a game poster now **zooms it slightly** (1.06×, eased) while the detail panel floats out; the feel is the same in both grid and bar views
      - 「近两周」排序改为**筛选**口径：切到它之后只显示这两周真正玩过的游戏，其余全部隐藏（一款没玩就显示「近两周没有玩过的游戏」），让"最近在玩什么"看得更清楚 / The "Last 2 weeks" sort is now a **filter**: switching to it shows only the games actually played in that window and hides everything else (an empty list reads "Nothing played in the last 2 weeks"), so "what am I playing right now" is much clearer
      - 「MC 分数分布」小窗的五档配色改为**直接复用封面评分徽章那套画刷**：四档单色与徽章是同一个画刷实例、90+ 则连到同一份全局流光渐变，因此封面右上角的徽章与该卡上的色点/数字颜色永远一致；90+ 那一档现在也是**流动的彩虹渐变色**（金/青/紫/粉/绿循环），且相位由同一个定时器推进、与封面徽章上的流光完全同步 / The five score bands in the "MC score spread" window now **reuse the exact brushes used by the cover score badges**: the four solid bands share brush instances with the badges, and 90+ hooks into the same global rainbow-flow gradient, so a badge on a cover and the dot/number in this card are always the same colour; the 90+ band is now the **animated rainbow flow** itself (cycling gold/cyan/purple/pink/green), phase-driven by the same timer and therefore perfectly in sync with the flow on the cover badges
      - 数据分析的「游戏类型分布」不再有「其他」兜底类别：每个类型都单独成一瓣，库里有多少种类型就画多少瓣，配色表扩充到 24 色并按序分配（超过后循环复用、相邻不撞色）/ The "Genre distribution" chart no longer merges the tail into an *Other* bucket: every genre gets its own slice, no matter how many you have, and the palette is expanded to 24 colours assigned in order (cycling on overflow with no adjacent repeats)
      - 修复环形饼图悬停「鬼畜」：鼠标移到某一瓣内侧边缘时，扇形会向外弹出导致鼠标底下的像素消失，从而在「选中／未选中」之间无限来回跳动；现在整个图表区域都参与命中测试，悬停状态稳定不再抖动 / Fixed donut-chart hover jitter: when the cursor sat on a slice's inner edge, the pop-out animation moved the painted pixels out from under it, causing the slice to flip endlessly between hovered and not; the whole chart area is now hit-testable, so the hover state stays stable
      - 「玩家形象」报告改得更生动打趣：八段文案大量使用网络热词（电子木乃伊／喜加一／电子榨菜／遥遥领先／电子功德／破防等），读起来像被好朋友在群里公开处刑；八段各自使用不同图标与不同版式（判词／数字行／①②③ 分条／纯正文），每段仍不少于 100 字、且都引用具体游戏 / The "Player profile" report is now livelier and wittier: all eight sections are packed with internet slang, reading like a close friend roasting you in the group chat; each section keeps its own icon and layout (verdict / figure line / ①②③ breakdown / plain prose), still 100+ characters each and grounded in concrete games
      - 侧边栏视图改为「三合一」：左上角标题右侧新增下拉选项卡，可在「库存统计／数据分析／趣味功能」三页间切换，原右上角「打开数据分析」按钮已移除（功能并入选项卡）/ The sidebar view is now a three-in-one shell: a dropdown tab sits right of the title and switches between Library / Analytics / Fun & Games, replacing the old top-right "open analytics" button
      - 概览条五张卡片改为紧凑式：平时只占一行高、只显示名称，把竖向空间让给游戏列表；鼠标移上去在旁边浮出一个独立小窗显示明细，小窗画在界面之上，不改变界面本身的布局 / The five overview cards are now compact: they take a single row and show only their name, giving vertical space back to the game list; hovering one floats a separate little window beside it with the details, drawn above the UI so the layout itself never changes
      - 「近两周时长」小窗逐款列出这两周玩过的游戏及各自时长（按时长降序，最多 8 款）/ The "Last 2 weeks" window now lists every game played in that window with its playtime (sorted by time, top 8)
      - 原「最肝游戏」卡改为「时长 Top 5」：小窗按总游玩时长排出前 5 名，每行「名次 + 游戏名 + 总时长」，只统计玩过的游戏 / The old "Most played" card is now "Top 5 by playtime": the window ranks the five most-played games by total playtime, each row showing rank + name + total time, played games only
      - 概览卡的悬浮小窗不再重复卡片标题（库存总数／MC 分数分布等），标题已在卡片上，小窗直接给数据 / The overview hover windows no longer repeat the card title (Games, MC score spread, …); the title is already on the card, so the window goes straight to the data
      - 趣味功能页改为全屏铺满，不再限制为居中的手机竖屏窄栏 / The Fun & Games page now fills the window instead of being a narrow centred mobile-style column
      - 「添加游戏」复选面板高度调高到约占屏幕总高度的一半，宽度随窗口自适应，一屏可见更多候选 / The "Add games" checkbox panel is now about half the window height with a window-relative width, so more candidates fit on screen
      - 概览条第 2 卡改为「MC 分数分布」：按 Metacritic 评分把库存分成 90+ / 80-89 / 70-79 / 60-69 / 60 以下五档，各档显示款数，色点与卡片评分徽章同色；副行给出 80+ 优秀款数与占比（无评分的游戏不计入任何一档） / The second overview card is now "MC score spread": the library is grouped into five Metacritic buckets (90+ / 80-89 / 70-79 / 60-69 / below 60) with a count in each, and the dots match the score badge colours; the sub-line shows how many rated 80+ and their share (unscored games fall into no bucket)
      - 标题右侧的下拉选项卡位置固定，切换页面时不会跟着页面内容左右移动 / The dropdown sits at a fixed position right of the title and no longer shifts when switching pages
      - 「库存统计」即原有游戏库存页，保留三种排序（总时长／近两周／评分）与两种视图（网格／条形）/ Library is the original vault page, keeping all three sort modes and both grid/bar views
      - 三个页面共用同一条顶栏，搜索框、排序、视图切换、语言、分享等控件按当前页自动显隐 / All three pages share one top bar; search, sort, view toggle, language and share controls show or hide according to the active page
      - 「趣味功能」页重做，只剩「待玩清单」：去掉原口味转盘及其筛选控件 / The Fun & Games page is reworked to contain only the To-play list; the old taste wheel and its filters are gone
      - 待玩清单新增「添加游戏」下拉：展开一个带搜索框的复选面板，勾选即加入、取消勾选即移出，面板不关可连勾多款 / New "Add games" dropdown on the to-play list: opens a searchable checkbox panel where ticking adds and unticking removes, and the panel stays open so you can tick several in a row
      - 待玩游戏列表支持手动拖拽排序：按住每行左侧的拖动柄上下拖即可调整顺序，序号自动从 1 重新排 / The to-play list can be reordered by hand: drag the handle on the left of each row up or down, and the 1-based numbering re-flows automatically
      - 每行左侧从上到下显示序号（1、2、3…），并保留置顶与移出按钮 / Each row shows its index (1, 2, 3 …) on the left and keeps the pin and remove buttons
      - 待玩清单随插件设置持久保存，重开 Playnite 后仍在 / The to-play list persists in plugin settings and survives a Playnite restart
      - 新增「数据分析」页：由顶部下拉选项卡进入，展示图表与报告 / New Analytics page: opened from the top dropdown tab, showing charts and the report
      - 按游戏类型标签绘制的环形饼图，可在「按时长／按款数」两种口径间切换 / Genre donut chart with a by-playtime / by-count basis toggle
      - 点击饼图任意一瓣或图例即可跳回库存页并按该类型过滤 / Click any slice or legend row to jump back to the vault filtered by that genre
      - 新增游戏时长 Top 50 榜，含排名、占比条与时长 / New Top 50 by playtime list with rank, share bar and playtime
      - 新增「你是一个什么样的玩家」玩家画像报告，六段式分析时长分布、集中度、未玩积压、类型偏好、评分偏好与近期活跃度 / New player profile report with six sections covering playtime distribution, concentration, backlog, genre and score preferences, and recent momentum
      - 报告文风统一为「傲娇锐评」，去掉「锐评／正式」切换开关；每段正文不少于 100 字，口吻改为「先嫌弃、后认可」的傲娇腔，先下判断再用数据论证 / Report style unified into a single tsundere voice ("savage but secretly fond"), dropping the Snarky/Formal toggle; every section is now at least 100 characters and leads with a verdict backed by data
      - 分析页顶部的文风标签由「毒舌锐评」改为「评价」 / The style label at the top of the Analytics page now reads "Review" instead of the style name
      - 报告完全由本地规则引擎生成，不联网、不上传数据、无需 API key / The report is generated entirely by a local rules engine - no network, no uploads, no API key
      - 玩家画像报告扩充为八段，新增「游玩节奏」与「收藏习惯」，全文更详细 / Player profile report expanded to eight sections, adding play rhythm and favourites habits, with richer prose
      - 报告底部新增「推荐同类好游戏」，按读出来的口味推荐同类型作品并附推荐理由，自动排除已玩过的游戏 / New "more games like these" recommendations at the end of the report, picked from your detected taste with reasons, excluding games you have already played
      - 分析页各面板可自由拖拽调整大小（左右宽度比、上下高度比），尺寸自动记忆 / Analytics panels are now freely resizable by dragging the splitters (column width and row height), and sizes are remembered
      - 分析页功能按钮改为居中排布，不再与窗口的最小化/最大化/关闭按钮重叠 / Analytics toolbar buttons are now centred instead of being placed where they overlapped the window buttons
      - 新增横向「游玩时间轴」：以月为间隔、每周一根柱，柱高为当周时长，悬停显示当周最爱玩的游戏与时长（数据来自 GameActivity 逐局记录） / New horizontal play timeline: monthly dividers with one bar per week, bar height = weekly playtime, hover shows the top game and time for that week (from GameActivity sessions)
      - 分享按钮由「复制文字」改为生成一张专门排版的竖版分享长图，自动复制到剪贴板并保存到「图片\GameVault」 / The share button now generates a purpose-laid-out portrait share image (copied to clipboard and saved to Pictures\GameVault) instead of copying plain text
      - 放大分析页的环形饼图，中心数字随尺寸自适应 / Enlarged the analytics donut chart, with centre figures scaling with the chart
      - 时间轴悬停卡片顶部改为显示完整周区间（如 7/20-7/26），不再只显示起始日；本周会带「本周」前缀 / Timeline hover card now shows the full week range (e.g. 7/20-7/26) instead of just the start date, with a "this week" prefix on the current week

  - Version: 1.0.1
    RequiredApiVersion: 6.16.0
    ReleaseDate: 2026-09-25
    PackageUrl: https://github.com/AbyssVII/playnite-gamevault/releases/download/v1.0.1/GameVault_1.0.1.pext
    Changelog:
      - 修复顶部工具条（排序按钮、语言下拉框、右下角缩放条）只有鼠标落在偏下位置才能点中的问题 / Fixed top toolbar controls (sort buttons, language dropdown, zoom slider) only responding to clicks in their lower part
      - 修复窗口较窄时顶部栏元素互相遮挡、导致语言下拉框大部分区域点不中的问题 / Fixed top bar elements overlapping on narrow windows, which made most of the language dropdown unclickable
      - 提高所有次要文字（库存总数、总游戏时长、开发商等标签）的对比度，并整体放大字号 / Improved contrast of all secondary labels and increased overall font size
      - 分享摘要由总时长 Top 10 扩展为 Top 50 / Extended the share summary from Top 10 to Top 50
      - 修复封面缺失时兜底文字几乎不可见的问题 / Fixed the placeholder game title being nearly invisible when a cover image is missing

  - Version: 1.0.0
    RequiredApiVersion: 6.16.0
    ReleaseDate: 2026-09-24
    PackageUrl: https://github.com/AbyssVII/playnite-gamevault/releases/download/v1.0.0/GameVault_1.0.0.pext
    Changelog:
      - 首个公开发布版本 / Initial public release.
      - 侧边栏「游戏库存」视图：顶部概览条 + 网格/条形双视图 + 实时搜索。
      - 支持按总时长、近两周时长、Metacritic 评分排序。
      - 同一游戏的多平台副本按名称合并，显示来源徽章，时长累加。
      - 悬停卡片显示完整海报、Metacritic 评分、开发商、发行商与时长明细。
      - 右下角可拖动缩放条，实时重排列数，尺寸跨会话保留。
      - 中英双语界面，可在插件内即时切换。
      - Metacritic 五档配色，90 分以上为流光溢彩的动态彩虹渐变。
