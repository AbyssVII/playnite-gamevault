name: Build & Release

# 推送到 main / 提 PR        → 只做编译检查
# 推送 v* 标签               → 编译并自动发布 Release
# 在 Actions 页面手动运行     → 填一个版本号即可发布（不需要动 git 标签）
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（例如 1.0.0）；留空则只编译不发布"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: 构建 (net48)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # 构建机上没有安装 Playnite，csproj 会自动回退到 NuGet 的官方
      # PlayniteSDK 包（见 GameVault.csproj 里 PlayniteSdkPath 的判断）。
      - name: 编译
        run: dotnet build -c Release -p:UseNuGetSdk=true

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: GameVault-dll
          path: bin/Release/GameVault.dll

  release:
    name: 打包并发布 .pext
    needs: build
    # 推送标签，或在 Actions 页面手动运行并填了版本号时才发布。
    # 这里显式判断 event_name，避免其他事件下 inputs 为空导致的误判。
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 版本号有两个来源：推送标签时取标签名，手动运行时取填写的输入。
      - name: 确定版本号
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Host "本次发布的版本号为 $v"

      - name: 下载编译产物
        uses: actions/download-artifact@v4
        with:
          name: GameVault-dll
          path: .

      - name: 确认产物到位
        shell: pwsh
        run: |
          if (-not (Test-Path "GameVault.dll")) {
            Write-Host "工作区内容："
            Get-ChildItem -Recurse -File | Select-Object -First 30 -ExpandProperty FullName
            throw "GameVault.dll 不在工作区根目录，下载产物这一步可能有问题"
          }
          Write-Host "GameVault.dll 已就位（$((Get-Item GameVault.dll).Length) 字节）"

      - name: 同步版本号到 extension.yaml
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $content = Get-Content extension.yaml -Raw
          $content = $content -replace '(?m)^Version:.*$', "Version: $ver"
          [System.IO.File]::WriteAllText("$PWD/extension.yaml", $content)
          Write-Host "extension.yaml 版本号 -> $ver"

      # 用 PowerShell 打包，不依赖 runner 上的 python 命令
      #（原先调用 python scripts/package.py 就是在这里失败的）。
      # 先把三个文件摊平到临时目录，保证它们位于压缩包根目录。
      - name: 打包 .pext
        shell: pwsh
        run: |
          $out = "GameVault_${{ steps.ver.outputs.version }}.pext"

          Remove-Item "_pkg" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "_pkg" | Out-Null
          Copy-Item extension.yaml, icon.png -Destination "_pkg"
          Copy-Item GameVault.dll -Destination "_pkg"

          Remove-Item $out -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "_pkg\*" -DestinationPath "$out.zip" -Force
          Move-Item "$out.zip" $out -Force
          Remove-Item "_pkg" -Recurse -Force

          if (-not (Test-Path $out)) { throw "打包失败：未生成 $out" }
          Write-Host "已生成 $out（$((Get-Item $out).Length) 字节）"
          Get-ChildItem $out | Select-Object Name, Length | Format-Table

      # Release 页面显示的更新说明取自 manifests/installer.yaml 里对应版本的 Changelog，
      # 而不是 GitHub 自动生成的 commit 列表 —— 用户要看的是"改了什么"，
      # 而不是一堆提交哈希。所以每次发版前记得先用 scripts/add-release.py 登记。
      - name: 生成 Release 说明
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $lines = Get-Content manifests/installer.yaml
          $notes = New-Object System.Collections.Generic.List[string]
          $inTarget = $false
          $inChangelog = $false

          foreach ($line in $lines) {
            if ($line -match '^\s*-\s+Version:\s*(\S+)\s*$') {
              if ($inTarget) { break }              # 走到下一条版本记录，结束
              if ($Matches[1] -eq $ver) { $inTarget = $true }
              continue
            }
            if (-not $inTarget) { continue }
            if ($line -match '^\s*Changelog:\s*$') { $inChangelog = $true; continue }
            if (-not $inChangelog) { continue }
            if ($line -match '^\s*-\s+(.+?)\s*$') {
              $notes.Add('- ' + $Matches[1])
            } elseif ($line.Trim() -eq '') {
              continue
            } else {
              break                                  # Changelog 块结束
            }
          }

          if ($notes.Count -eq 0) {
            Write-Warning "installer.yaml 里没有 $ver 的 Changelog，说明将只含标题"
            $notes.Add('本次发布未在 manifests/installer.yaml 中登记更新说明。')
          }

          $all = @("## GameVault $ver", "", "### 更新内容 / What's changed", "") + @($notes)
          [System.IO.File]::WriteAllLines("$PWD/release-notes.md", $all,
            [System.Text.UTF8Encoding]::new($false))   # 不带 BOM，避免首行出现多余字符
          Write-Host "已生成 release-notes.md（$($notes.Count) 条）："
          Get-Content release-notes.md

      # Release 可能已存在（重复推送同一个标签时），此时改为更新说明和附件，
      # 否则 gh release create 会因标签已占用而失败。
      - name: 创建或更新 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $file = (Get-ChildItem "GameVault_*.pext" | Select-Object -First 1).Name

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，更新说明与附件"
            gh release edit $tag --title $tag --notes-file release-notes.md
            gh release upload $tag $file --clobber
          } else {
            Write-Host "创建 Release：$tag（附件 $file）"
            gh release create $tag $file --title $tag --notes-file release-notes.md --target "${{ github.sha }}"
          }
