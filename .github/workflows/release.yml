name: Build & Release

# 每次推送到 main / 提 PR 先验证能否编译；打 v* 标签则自动打包并发布 Release。
# 发布流程见 README「发布新版本」一节。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 (net48)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # 构建机上没有安装 Playnite，csproj 会自动回退到 NuGet 的官方
      # PlayniteSDK 包（见 GameVault.csproj 里 PlayniteSdkPath 的判断）。
      - name: 编译
        run: dotnet build -c Release -p:UseNuGetSdk=true

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: GameVault-dll
          path: bin/Release/GameVault.dll

  release:
    name: 打包并发布 .pext
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载编译产物
        uses: actions/download-artifact@v4
        with:
          name: GameVault-dll
          path: .

      - name: 确认产物到位
        shell: pwsh
        run: |
          if (-not (Test-Path "GameVault.dll")) {
            Write-Host "工作区内容："
            Get-ChildItem -Recurse -File | Select-Object -First 30 -ExpandProperty FullName
            throw "GameVault.dll 不在工作区根目录，下载产物这一步可能有问题"
          }
          Write-Host "GameVault.dll 已就位（$((Get-Item GameVault.dll).Length) 字节）"

      # extension.yaml 里的版本号以 git tag 为唯一来源，避免两边不一致。
      - name: 同步版本号到 extension.yaml
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $content = Get-Content extension.yaml -Raw
          $content = $content -replace '(?m)^Version:.*$', "Version: $ver"
          [System.IO.File]::WriteAllText("$PWD/extension.yaml", $content)
          Write-Host "extension.yaml 版本号 -> $ver"

      # 用 PowerShell 打包，不依赖 runner 上的 python 命令
      # （原先调用 python scripts/package.py 就是在这里失败的）。
      # 先把三个文件摊平到临时目录，保证它们位于压缩包根目录。
      - name: 打包 .pext
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $out = "GameVault_$ver.pext"

          Remove-Item "_pkg" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "_pkg" | Out-Null
          Copy-Item extension.yaml, icon.png -Destination "_pkg"
          Copy-Item GameVault.dll -Destination "_pkg"

          Remove-Item $out -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "_pkg\*" -DestinationPath "$out.zip" -Force
          Move-Item "$out.zip" $out -Force
          Remove-Item "_pkg" -Recurse -Force

          if (-not (Test-Path $out)) { throw "打包失败：未生成 $out" }
          Write-Host "已生成 $out（$((Get-Item $out).Length) 字节）"
          Get-ChildItem $out | Select-Object Name, Length | Format-Table

      - name: 创建 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $file = (Get-ChildItem "GameVault_*.pext" | Select-Object -First 1).Name
          gh release create $tag $file --title $tag --generate-notes
